name: Service Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: AI/RAG unit tests (fake providers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: ruff check .
      - name: Run service tests (no keys required)
        run: pytest -q -m "not postgres"

  postgres:
    name: PostgreSQL + pgvector integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-rag
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ielts_rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run PostgreSQL integration tests
        env:
          POSTGRES_TEST_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ielts_rag_test
        run: pytest -q -m postgres
