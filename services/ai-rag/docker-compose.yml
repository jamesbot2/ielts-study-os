# Disposable PostgreSQL + pgvector for local integration tests.
# Usage (optional):  docker compose up -d db
# Then: POSTGRES_TEST_URL=postgresql+psycopg://ielts:ielts@localhost:5432/ielts_rag_test pytest -m postgres

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ielts
      POSTGRES_PASSWORD: ielts
      POSTGRES_DB: ielts_rag_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ielts"]
      interval: 5s
      timeout: 5s
      retries: 10
