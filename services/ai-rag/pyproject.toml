[project]
name = "ielts-study-os-ai-rag"
version = "0.6.3"
description = "Independent AI/RAG service for IELTS Study OS: knowledge retrieval, learner-aware coach, evaluation."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "pgvector>=0.3",
    "psycopg[binary]>=3.1",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "postgres: requires a live PostgreSQL+pgvector database (POSTGRES_TEST_URL)",
]

[tool.ruff]
line-length = 100
